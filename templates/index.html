<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#1a73e8" />
  <title>OCR Поръчки</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      color: #1e293b;
      min-height: 100vh;
    }

    header {
      background: #1a73e8;
      color: #fff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,.2);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 { font-size: 1.2rem; font-weight: 600; }
    header span { font-size: 1.6rem; }

    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    .card h2 {
      font-size: .85rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #64748b;
      margin-bottom: 14px;
    }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed #93c5fd;
      border-radius: 12px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: background .2s, border-color .2s;
      position: relative;
    }

    .upload-zone:hover, .upload-zone.drag-over {
      background: #eff6ff;
      border-color: #3b82f6;
    }

    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon { font-size: 2.4rem; display: block; margin-bottom: 8px; }

    .upload-label {
      font-size: .95rem;
      color: #1a73e8;
      font-weight: 600;
    }

    .upload-hint {
      font-size: .8rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    /* Preview */
    #preview-wrap { display: none; margin-top: 14px; text-align: center; }
    #preview-img {
      max-width: 100%;
      max-height: 260px;
      border-radius: 10px;
      object-fit: contain;
      border: 1px solid #e2e8f0;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity .2s, transform .1s;
    }

    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .btn-primary { background: #1a73e8; color: #fff; }
    .btn-camera  { background: #0f766e; color: #fff; }
    .btn-clear   { background: #f1f5f9; color: #475569; font-size: .9rem; padding: 10px; margin-top: 8px; }

    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Spinner */
    .spinner {
      width: 20px; height: 20px;
      border: 3px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Result */
    #result-card { display: none; }

    .field-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;
    }

    .field-row:last-child { border-bottom: none; }

    .field-label {
      font-size: .75rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .field-value {
      font-size: .95rem;
      color: #1e293b;
      word-break: break-word;
    }

    .field-value.empty { color: #cbd5e1; font-style: italic; }

    .items-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .items-list li {
      background: #f8fafc;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: .9rem;
    }

    /* Raw text toggle */
    details { margin-top: 14px; }
    summary {
      font-size: .8rem;
      color: #1a73e8;
      cursor: pointer;
      user-select: none;
      padding: 6px 0;
    }

    .raw-text {
      font-family: monospace;
      font-size: .78rem;
      background: #f8fafc;
      border-radius: 8px;
      padding: 12px;
      margin-top: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      color: #475569;
      max-height: 200px;
      overflow-y: auto;
    }

    /* Error */
    .error-msg {
      background: #fef2f2;
      color: #dc2626;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: .9rem;
      display: none;
    }
  </style>
</head>
<body>

<header>
  <span>📋</span>
  <h1>OCR Поръчки — Телефон</h1>
</header>

<main>

  <div class="card">
    <h2>Качи снимка на поръчка</h2>

    <div class="upload-zone" id="drop-zone">
      <input type="file" id="file-input" accept="image/*" />
      <span class="upload-icon">🖼️</span>
      <div class="upload-label">Избери изображение</div>
      <div class="upload-hint">JPG, PNG, WEBP · до 16 MB</div>
    </div>

    <div id="preview-wrap">
      <img id="preview-img" src="" alt="Преглед" />
    </div>

    <div class="btn-row" style="margin-top:16px">
      <button class="btn btn-camera" id="camera-btn" onclick="document.getElementById('camera-input').click()">
        📷 Снимай с камера
      </button>
      <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none" />

      <button class="btn btn-primary" id="process-btn" disabled>
        <span class="spinner" id="spinner"></span>
        <span id="btn-text">🔍 Разпознай поръчка</span>
      </button>

      <button class="btn btn-clear" id="clear-btn" style="display:none">✕ Изчисти</button>
    </div>
  </div>

  <div class="error-msg" id="error-msg"></div>

  <div class="card" id="result-card">
    <h2>Разпозната поръчка</h2>

    <div class="field-row">
      <span class="field-label">Клиент</span>
      <span class="field-value" id="r-name">—</span>
    </div>
    <div class="field-row">
      <span class="field-label">Телефон</span>
      <span class="field-value" id="r-phone">—</span>
    </div>
    <div class="field-row">
      <span class="field-label">Адрес</span>
      <span class="field-value" id="r-address">—</span>
    </div>
    <div class="field-row">
      <span class="field-label">Артикули</span>
      <ul class="items-list" id="r-items"><li class="field-value empty">—</li></ul>
    </div>
    <div class="field-row">
      <span class="field-label">Обща сума</span>
      <span class="field-value" id="r-total">—</span>
    </div>

    <details>
      <summary>Целият разпознат текст</summary>
      <pre class="raw-text" id="r-raw"></pre>
    </details>
  </div>

</main>

<script>
  const fileInput   = document.getElementById('file-input');
  const cameraInput = document.getElementById('camera-input');
  const processBtn  = document.getElementById('process-btn');
  const clearBtn    = document.getElementById('clear-btn');
  const spinner     = document.getElementById('spinner');
  const btnText     = document.getElementById('btn-text');
  const previewWrap = document.getElementById('preview-wrap');
  const previewImg  = document.getElementById('preview-img');
  const resultCard  = document.getElementById('result-card');
  const errorMsg    = document.getElementById('error-msg');
  const dropZone    = document.getElementById('drop-zone');

  let selectedFile = null;

  function setFile(file) {
    if (!file) return;
    selectedFile = file;
    const url = URL.createObjectURL(file);
    previewImg.src = url;
    previewWrap.style.display = 'block';
    processBtn.disabled = false;
    clearBtn.style.display = 'inline-flex';
    hideError();
    resultCard.style.display = 'none';
  }

  fileInput.addEventListener('change', e => setFile(e.target.files[0]));
  cameraInput.addEventListener('change', e => setFile(e.target.files[0]));

  // Drag & drop
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    setFile(e.dataTransfer.files[0]);
  });

  clearBtn.addEventListener('click', () => {
    selectedFile = null;
    fileInput.value = '';
    cameraInput.value = '';
    previewWrap.style.display = 'none';
    processBtn.disabled = true;
    clearBtn.style.display = 'none';
    resultCard.style.display = 'none';
    hideError();
  });

  processBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    setLoading(true);
    hideError();
    resultCard.style.display = 'none';

    const form = new FormData();
    form.append('image', selectedFile);

    try {
      const res = await fetch('/ocr', { method: 'POST', body: form });
      const data = await res.json();

      if (data.error) {
        showError(data.error);
      } else {
        renderResult(data);
      }
    } catch {
      showError('Неуспешна връзка със сървъра. Опитайте отново.');
    } finally {
      setLoading(false);
    }
  });

  function setLoading(on) {
    processBtn.disabled = on;
    spinner.style.display = on ? 'block' : 'none';
    btnText.textContent = on ? 'Обработка…' : '🔍 Разпознай поръчка';
  }

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
  }

  function hideError() {
    errorMsg.style.display = 'none';
  }

  function val(v) {
    return v || '<span class="empty">не е разпознато</span>';
  }

  function renderResult(d) {
    document.getElementById('r-name').innerHTML    = val(d.customer_name);
    document.getElementById('r-phone').innerHTML   = val(d.phone);
    document.getElementById('r-address').innerHTML = val(d.address);
    document.getElementById('r-total').innerHTML   = val(d.total);

    const list = document.getElementById('r-items');
    if (d.items && d.items.length) {
      list.innerHTML = d.items.map(i => `<li>${i}</li>`).join('');
    } else {
      list.innerHTML = '<li class="field-value empty">не е разпознато</li>';
    }

    document.getElementById('r-raw').textContent = d.raw_text || '';
    resultCard.style.display = 'block';
    resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
</script>

</body>
</html>
